[project]
name = "everyday-news"
version = "0.1.0"
description = "Personal news aggregator that filters out noise and writes a daily Markdown digest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "typer>=0.12",
]

[project.scripts]
news = "everyday_news.cli:app"

[dependency-groups]
# uv lives inside .venv (decision Q6); keep it listed so `uv sync` doesn't remove it
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "uv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/everyday_news"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
